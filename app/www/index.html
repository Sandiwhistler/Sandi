<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#faf4ee">
  <title>SANDI</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Welcome screen, shown once per launch -->
  <section class="welcome" id="welcome">
    <span class="eyebrow">The Summer Collection</span>
    <div class="welcome__center">
      <img class="welcome__logo" src="img/logo-red.png" alt="SANDI" width="810" height="336">
      <p class="welcome__tagline">Made for summer</p>
      <button class="btn" id="enter" type="button">Enter</button>
    </div>
    <span class="eyebrow">Locally made</span>
  </section>

  <header class="topbar">
    <img src="img/logo-red.png" alt="SANDI" width="63" height="26">
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- Product detail sheet -->
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet__backdrop" data-close></div>
    <article class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button class="sheet__close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="sheet-body"></div>
    </article>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="shop" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span>Shop</span>
    </button>
    <button type="button" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>
      <span>Saved</span>
    </button>
    <button type="button" data-tab="about">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>About</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
